<!DOCTYPE html>
<html lang="ko">
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Premium golf experience by FIAT GOLF">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="FIAT GOLF">
  <link rel="apple-touch-icon" href="favicon.png">

  <!-- Favicon -->
  <meta name="theme-color" content="#27AE60">
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>FIAT GOLF</title>
  <link rel="manifest" href="manifest.json">

  <style>
    body {
      background-color: #f8f9fa;
      margin: 0;
      padding: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    .loading-container {
      text-align: center;
      animation: fadeIn 1s ease-in;
    }
    .loading-logo {
      width: 120px;
      height: 120px;
      box-shadow: 0 10px 20px rgba(0,0,0,0.1);
      border-radius: 28px;
      margin-bottom: 24px;
      object-fit: cover;
    }
    .spinner {
      width: 40px;
      height: 40px;
      border: 3px solid rgba(39, 174, 96, 0.1);
      border-radius: 50%;
      border-top-color: #27AE60;
      animation: spin 1s ease-in-out infinite;
      margin: 0 auto;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations().then(function(registrations) {
        for(let registration of registrations) { registration.unregister(); }
      });
    }
    if ('caches' in window) {
      caches.keys().then(function(names) {
        for (let name of names) { caches.delete(name); console.log("Cache cleared: " + name); }
      });
    }
  </script>
  <div class="loading-container">
    <img src="favicon.png" alt="Logo" class="loading-logo">
    <div class="spinner"></div>
    <p style="color: #27AE60; font-weight: 500; margin-top: 16px; letter-spacing: 1px;">FIAT GOLF 로딩 중...</p>
  </div>
  <script src="flutter_bootstrap.js?v=04052210" async></script>
</body>
</html>
