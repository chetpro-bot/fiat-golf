<!DOCTYPE html>
<html lang="ko">
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Premium golf experience by FIAT GOLF">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="FIAT GOLF">
  <link rel="apple-touch-icon" href="favicon.png">

  <!-- Favicon -->
  <meta name="theme-color" content="#27AE60">
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>FIAT GOLF</title>
  <link rel="manifest" href="manifest.json?v=20260424011">

  <style>
    body {
      background-color: #f8f9fa;
      margin: 0;
      padding: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    .loading-container {
      text-align: center;
      animation: fadeIn 1s ease-in;
    }
    .loading-logo {
      width: 120px;
      height: 120px;
      box-shadow: 0 10px 20px rgba(0,0,0,0.1);
      border-radius: 28px;
      margin-bottom: 24px;
      object-fit: cover;
    }
    .spinner {
      width: 40px;
      height: 40px;
      border: 3px solid rgba(39, 174, 96, 0.1);
      border-radius: 50%;
      border-top-color: #27AE60;
      animation: spin 1s ease-in-out infinite;
      margin: 0 auto;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>
  <script>
    // ==========================================================
    // 강제 캐시 무효화 — 배포마다 BUILD_TS 값을 반드시 바꾸세요.
    // ==========================================================
    var BUILD_TS = '20260424011';   // ← 배포할 때마다 이 값을 변경 (YYYYMMDD + 빌드번호)
    var TS_KEY   = 'fiat_golf_build_ts';

    // Service Worker 전부 즉시 해제
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations().then(function(regs) {
        regs.forEach(function(r) { r.unregister(); });
      });
    }

    var savedTs = localStorage.getItem(TS_KEY);

    if (savedTs !== BUILD_TS) {
      // 새 빌드 감지 → 모든 캐시 삭제 후 새로고침
      console.log('[FIAT GOLF] New build detected (' + savedTs + ' → ' + BUILD_TS + '). Clearing cache...');
      if ('caches' in window) {
        caches.keys().then(function(names) {
          return Promise.all(names.map(function(n) { return caches.delete(n); }));
        }).then(function() {
          localStorage.setItem(TS_KEY, BUILD_TS);
          // location.replace 로 히스토리 쌓지 않고 교체 (무한루프 방지)
          window.location.replace(window.location.href.split('?')[0] + '?_cb=' + BUILD_TS);
        });
      } else {
        localStorage.setItem(TS_KEY, BUILD_TS);
        window.location.replace(window.location.href.split('?')[0] + '?_cb=' + BUILD_TS);
      }
    }
  </script>

  <div class="loading-container">
    <img src="favicon.png" alt="Logo" class="loading-logo">
    <div class="spinner"></div>
    <p style="color: #27AE60; font-weight: 500; margin-top: 16px; letter-spacing: 1px;">FIAT GOLF 로딩 중...</p>
  </div>

  <!--
    flutter_bootstrap.js 뒤의 ?v= 쿼리스트링도 BUILD_TS 와 맞춰주세요.
    캐시된 index.html 이 있더라도 이 URL이 다르면 브라우저가 새 파일을 받습니다.
  -->
  <script src="flutter_bootstrap.js?v=20260424011" async></script>
</body>
</html>
